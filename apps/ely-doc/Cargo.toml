publish.workspace = true
build = "../../packaging/windows/icon.rs"

[build-dependencies]
embed-resource.workspace = true

[dependencies]
csv.workspace = true
anyhow.workspace = true
directories.workspace = true
ely-files.workspace = true
ely-gpui-component.workspace = true
ely-lok = { workspace = true, features = ["view"] }
